# Publish to npm via Trusted Publishing (OIDC) when a version tag is pushed.
# No NPM_TOKEN secret required after npmjs.com Trusted Publisher is configured.
# Docs: https://docs.npmjs.com/trusted-publishers
#
# Requires:
# - Node >= 22.14, npm CLI >= 11.5.1
# - permissions.id-token: write
# - npm package Settings → Trusted Publisher → GitHub Actions:
#     user: QinYangWang
#     repo: baribari
#     workflow: publish.yml
#     allowed: npm publish

name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC → npm trusted publish

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        # pnpm/action-setup@v4.1.0
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.20.0

      - name: Setup Node.js
        # actions/setup-node@v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11.6.2
          node -v
          npm -v
          pnpm -v

      - name: Install dependencies
        # Frozen lockfile; lifecycle scripts only for reviewed allowBuilds entries.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build CLI
        run: pnpm run build

      - name: Pack check
        run: pnpm run pack:check

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match apps/cli package.json version $PKG"
            echo "Bump version in apps/cli/package.json, commit, then tag v\$version"
            exit 1
          fi
          echo "Publishing baribari@$PKG"

      # OIDC is auto-detected; no NODE_AUTH_TOKEN / NPM_TOKEN needed.
      # Provenance is generated automatically for public repos + public packages.
      # Publish only the apps/cli baribari package (not docs or workspace root).
      - name: Publish to npm
        working-directory: apps/cli
        run: npm publish --access public --ignore-scripts
