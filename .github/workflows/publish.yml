# Publish to npm via Trusted Publishing (OIDC) when a version tag is pushed.
# No NPM_TOKEN secret required after npmjs.com Trusted Publisher is configured.
# Docs: https://docs.npmjs.com/trusted-publishers
#
# Requires:
# - Node >= 22.14, npm CLI >= 11.5.1
# - permissions.id-token: write
# - npm package Settings → Trusted Publisher → GitHub Actions:
#     user: QinYangWang
#     repo: baribari
#     workflow: publish.yml
#     allowed: npm publish

name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC → npm trusted publish

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - name: Install dependencies
        # bionic-audio is win32-only; --force allows install on Linux CI for build/publish
        run: npm ci --force --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            echo "Bump version in package.json, commit, then tag v\$version"
            exit 1
          fi
          echo "Publishing baribari@$PKG"

      # OIDC is auto-detected; no NODE_AUTH_TOKEN / NPM_TOKEN needed.
      # Provenance is generated automatically for public repos + public packages.
      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
